services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
      MYSQL_DATABASE: "finance_tracker"
      MYSQL_USER: "finance_user"
      MYSQL_PASSWORD: "secret"

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  laravel:
    build:
      context: ./api/PAD_Api

    container_name: finance-laravel

    ports:
      - "8000:8000"

    volumes:
      - ./api/PAD_Api:/app
      - /app/vendor

    depends_on:
      - mysql

  vue:
    build:
      context: ./webapp/PAD_App
    container_name: finance-vue
    ports:
      - "5180:5180"
    volumes:
      - ./webapp/PAD_App:/app
      - /app/node_modules
    depends_on:
      - laravel

volumes:
  mysql-data: